name: fmm3dbie-webgpu
description: "fmm3dbie's Helmholtz impedance and Neumann solvers on WebGPU, for numbl"
version:
license: "Apache-2.0"
homepage: "https://github.com/fastalgorithms/fmm3dbie"
repository: "https://github.com/fastalgorithms/fmm3dbie"
dependencies: []

# matlab/         upstream fmm3dbie MATLAB code, with +helm3d/+impedance and
#                 +helm3d/+neumann solver/eval replaced by GPU versions
# matlab/src      upstream helper m-files
# matlab/webgpu   the GPU gateway (fmm3dbie_gpu.numbl.js and its bundled
#                 backend), a stub for the fmm3dbie MEX, quad_sphere,
#                 mie_sound_hard
paths:
  - path: "matlab"
  - path: "matlab/src"
  - path: "matlab/webgpu"

builds:
  # numbl only: the solvers run on WebGPU through numbl's gpu global (browser).
  # Nothing is compiled; the backend bundle is prebuilt (backend/build.mjs).
  - architectures: [numbl_wasm]
    test_script: test_fmm3dbie_webgpu.m
